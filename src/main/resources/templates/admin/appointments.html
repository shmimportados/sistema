<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - Sistema de Agendamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">Sistema de Agendamento</div>
        <div class="navbar-menu">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1 th:text="'Agendamentos - ' + ${business.name}"></h1>
            <a th:href="@{/admin/appointments/{id}/new(id=${business.id})}" class="btn btn-primary">Novo Agendamento</a>
        </div>

        <div class="appointments-section">
            <div class="filter-section">
                <h3>Filtros</h3>
                <select id="statusFilter">
                    <option value="">Todos os Status</option>
                    <option value="PENDING">Pendentes</option>
                    <option value="CONFIRMED">Confirmados</option>
                    <option value="COMPLETED">Realizados</option>
                    <option value="CANCELLED">Cancelados</option>
                </select>
            </div>

            <div th:if="${appointments.isEmpty()}" class="empty-state">
                <p>Nenhum agendamento encontrado.</p>
            </div>

            <table class="appointments-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Serviço</th>
                        <th>Data/Hora</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appointment : ${appointments}">
                        <td th:text="${appointment.customerId}"></td>
                        <td th:text="${appointment.serviceId}"></td>
                        <td th:text="${appointment.appointmentDateTime}"></td>
                        <td>
                            <span class="badge" th:classappend="'badge-' + ${appointment.status.toLowerCase()}"
                                  th:text="${appointment.status}"></span>
                        </td>
                        <td>
                            <form th:if="${appointment.status == 'PENDING'}" 
                                  method="post" 
                                  th:action="@{/admin/appointments/{businessId}/{appointmentId}/confirm(businessId=${business.id}, appointmentId=${appointment.id})}"
                                  style="display: inline-block;">
                                <button type="submit" class="btn btn-small btn-success">Confirmar</button>
                            </form>
                            
                            <form method="post" 
                                  th:action="@{/admin/appointments/{businessId}/{appointmentId}/cancel(businessId=${business.id}, appointmentId=${appointment.id})}"
                                  style="display: inline-block;">
                                <button type="submit" class="btn btn-small btn-danger">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <style>
        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .appointments-table th,
        .appointments-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .appointments-table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-pending {
            background-color: #ffc107;
            color: #000;
        }

        .badge-confirmed {
            background-color: #28a745;
            color: #fff;
        }

        .badge-completed {
            background-color: #17a2b8;
            color: #fff;
        }

        .badge-cancelled {
            background-color: #dc3545;
            color: #fff;
        }
    </style>
</body>
</html>
