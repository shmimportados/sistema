<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Agendamento - Sistema de Agendamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">Sistema de Agendamento</div>
        <div class="navbar-menu">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <h1>Criar Novo Agendamento</h1>

            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>

            <form method="post" th:action="@{/admin/appointments/{id}/create(id=${business.id})}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="customerId">Cliente:</label>
                        <select id="customerId" name="customerId" required>
                            <option value="">Selecione um cliente...</option>
                            <option th:each="customer : ${customers}" th:value="${customer.id}" 
                                    th:text="${customer.fullName}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="serviceId">Serviço:</label>
                        <select id="serviceId" name="serviceId" required>
                            <option value="">Selecione um serviço...</option>
                            <option th:each="service : ${services}" th:value="${service.id}" 
                                    th:text="${service.name} + ' - R$ ' + ${#numbers.formatDecimal(service.price, 0, 'POINT', 2, 'COMMA')}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="appointmentDateTime">Data e Hora:</label>
                    <input type="datetime-local" id="appointmentDateTime" name="appointmentDateTime" required>
                </div>

                <div class="form-group">
                    <label for="notes">Observações:</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Criar Agendamento</button>
                    <a th:href="@{/admin/appointments/{id}(id=${business.id})}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
