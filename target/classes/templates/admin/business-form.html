<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Negócio - Sistema de Agendamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">Sistema de Agendamento</div>
        <div class="navbar-menu">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/auth/logout}">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <h1>Criar Novo Negócio</h1>

            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>

            <form method="post" th:action="@{/admin/business/create}" class="business-form">
                <h2>Informações Básicas</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nome do Negócio:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Tipo de Negócio:</label>
                        <select id="type" name="type" required>
                            <option value="">Selecione...</option>
                            <option th:each="type : ${businessTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Descrição:</label>
                    <textarea id="description" name="description" rows="4"></textarea>
                </div>

                <h2>Contato</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Telefone:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="whatsappPhone">WhatsApp:</label>
                        <input type="tel" id="whatsappPhone" name="whatsappPhone" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <h2>Endereço</h2>

                <div class="form-group">
                    <label for="address">Rua:</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Cidade:</label>
                        <input type="text" id="city" name="city" required>
                    </div>

                    <div class="form-group">
                        <label for="state">Estado:</label>
                        <input type="text" id="state" name="state" required>
                    </div>

                    <div class="form-group">
                        <label for="zipCode">CEP:</label>
                        <input type="text" id="zipCode" name="zipCode" required>
                    </div>
                </div>

                <h2>Configurações</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="businessHoursStart">Horário de Abertura:</label>
                        <input type="time" id="businessHoursStart" name="businessHoursStart" value="08:00">
                    </div>

                    <div class="form-group">
                        <label for="businessHoursEnd">Horário de Fechamento:</label>
                        <input type="time" id="businessHoursEnd" name="businessHoursEnd" value="18:00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="appointmentDurationMinutes">Duração do Agendamento (minutos):</label>
                        <input type="number" id="appointmentDurationMinutes" name="appointmentDurationMinutes" value="60" min="15" step="15">
                    </div>

                    <div class="form-group">
                        <label for="reminderHoursBefore">Lembrete com Antecedência (horas):</label>
                        <input type="number" id="reminderHoursBefore" name="reminderHoursBefore" value="24" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="enableEmailReminder" name="enableEmailReminder" checked>
                            Ativar Lembrete por Email
                        </label>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="enableWhatsappReminder" name="enableWhatsappReminder" checked>
                            Ativar Lembrete por WhatsApp
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Criar Negócio</button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <style>
        .business-form h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
    </style>
</body>
</html>
